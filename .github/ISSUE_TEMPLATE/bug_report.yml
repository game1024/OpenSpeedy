name: Bug Report（Bug 反馈）
description: Report a bug or unexpected behavior（报告异常行为或错误）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **AI-generated issues will be rejected.**（AI 生成的 Issue 一律拒绝。）
        >
        > Please describe the problem in your own words. Issues written or generated by AI will be closed without a reply.
        > （请用你自己的语言描述问题。由 AI 代写、翻译或整段套用生成内容的 Issue 会被直接关闭，不再回复。）

        Please search existing issues first and make sure you are on the latest version.
        （提交前请先搜索已有 Issue，并确认使用的是最新版本，版本号见「关于」页。）
  - type: textarea
    id: software-info
    attributes:
      label: Software information（软件信息）
      description: |
        Open the About page, click "System Info" and paste the copied JSON here.
        （打开「关于」页面，点击「软件信息」按钮，把复制到的 JSON 原样粘贴到这里。）
      placeholder: |
        {
          "appName": "OpenSpeedy",
          "appVersion": "3.3.20",
          "tauriVersion": "2.11.3",
          "platform": "windows",
          "platformArch": "x86_64",
          "platformVersion": "10.0.26300"
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?（问题描述）
      description: |
        What went wrong? On which page and after which action?
        （发生了什么？在哪个页面、执行什么操作时出现？）
      placeholder: |
        e.g. After enabling acceleration for a game, the speed did not change.
        （例如：在「变速」页勾选某个游戏后，倍速没有变化，但界面显示已开启。）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce（复现步骤）
      description: |
        List the steps that reliably reproduce the problem.
        （按顺序列出可以稳定复现问题的操作。）
      placeholder: |
        1. Open OpenSpeedy（打开 OpenSpeedy）
        2. Select a process（在进程列表中选择 xxx）
        3. Press the shortcut（按下 xxx 快捷键）
        4. Observe ...（观察到 xxx）
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected vs. actual result（期望结果与实际结果）
      placeholder: |
        Expected（期望）：...
        Actual（实际）：...
  - type: input
    id: target-app
    attributes:
      label: Game or application involved (optional)（相关游戏或程序，可选）
      description: |
        If the problem relates to a specific game or program, name it and its version/platform.
        （如果问题与特定游戏或程序有关，请填写名称、版本和平台。）
      placeholder: Game / version / platform (Steam, Epic, standalone...)（游戏名 / 版本 / 平台）
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)（日志，可选）
      description: |
        Click "Open Log" on the About page and attach that day's log file. You can drag the file here.
        （点击「关于」页的「打开日志」按钮，附上出问题当天的日志文件，可以直接拖到这里。）
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation（提交确认）
      options:
        - label: This issue was written by me, not generated by AI.（我确认这个 Issue 由我本人撰写，不是 AI 生成的。）
          required: true
        - label: I have searched existing issues and found no duplicate.（我已搜索过现有 Issue，确认没有重复。）
          required: true
        - label: I have tried to reproduce this on the latest version.（我已尝试在最新版本上复现该问题。）
          required: true
