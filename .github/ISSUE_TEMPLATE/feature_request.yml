name: Feature Request（功能建议）
description: Suggest a new feature or improvement（提出新功能或改进建议）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **AI-generated issues will be rejected.**（AI 生成的 Issue 一律拒绝。）
        >
        > Please describe the request in your own words. Issues written or generated by AI will be closed without a reply.
        > （请用你自己的语言描述需求。由 AI 代写、翻译或整段套用生成内容的 Issue 会被直接关闭，不再回复。）

        Please search existing issues first to avoid duplicates.
        （提交前请先搜索已有 Issue，避免重复建议。）
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve（想解决的问题）
      description: |
        What is inconvenient? Which scenario should be improved?
        （你遇到了什么不便？希望改善哪个使用场景？）
      placeholder: |
        e.g. I have to reconfigure shortcuts every time I switch games.
        （例如：每次换游戏都要手动调整快捷键和倍率，希望能自动区分不同游戏。）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature（期望的功能）
      description: |
        What should OpenSpeedy add or change? Describe how you imagine using it.
        （你希望 OpenSpeedy 增加或改变什么？请描述你设想的使用方式。）
      placeholder: |
        Describe the feature, the page it lives on and how it would be used.
        （描述这个功能大概长什么样、在哪个页面使用、怎么操作。）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (optional)（替代方案，可选）
      description: |
        How do you work around this today? Any other implementation ideas?
        （你目前是怎么绕过这个问题的？或者有别的实现思路吗？）
  - type: input
    id: version
    attributes:
      label: Current version (optional)（当前版本，可选）
      description: |
        The version is shown on the About page.
        （版本号可以在「关于」页查看。）
      placeholder: e.g. 3.3.20（例如：3.3.20）
  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)（补充信息，可选）
      description: |
        Screenshots, reference links, how other apps do it, etc.
        （截图、参考链接、类似软件的做法等，都可以放在这里。）
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation（提交确认）
      options:
        - label: This issue was written by me, not generated by AI.（我确认这个 Issue 由我本人撰写，不是 AI 生成的。）
          required: true
        - label: I have searched existing issues and found no duplicate.（我已搜索过现有 Issue，确认没有重复。）
          required: true
