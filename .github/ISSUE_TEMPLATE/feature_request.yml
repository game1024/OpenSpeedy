name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **AI 生成的 Issue 一律拒绝。**
        > 请用你自己的语言描述需求。由 AI 代写、翻译或整段套用生成内容的 Issue 会被直接关闭，不再回复。

        提交前请先搜索已有 Issue，避免重复建议。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么不便？希望改善哪个使用场景？
      placeholder: 例如：每次换游戏都要手动调整快捷键和倍率，希望能自动区分不同游戏。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 你希望 OpenSpeedy 增加或改变什么？请描述你设想的使用方式。
      placeholder: 描述这个功能大概长什么样、在哪个页面使用、怎么操作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你目前是怎么绕过这个问题的？或者有别的实现思路吗？
  - type: input
    id: version
    attributes:
      label: 当前版本（可选）
      description: 版本号可以在「关于」页查看。
      placeholder: 例如：3.5.0
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、参考链接、类似软件的做法等，都可以放在这里。
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我确认这个 Issue 由我本人撰写，不是 AI 生成的。
          required: true
        - label: 我已搜索过现有 Issue，确认没有重复。
          required: true
